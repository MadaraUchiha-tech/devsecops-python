# Lab 1: ImagePullBackOff. The tag does not exist in GHCR.
# Investigate: kubectl get pods -n careslot ; kubectl describe pod <pod> -n careslot ; kubectl get events -n careslot --sort-by=.lastTimestamp
apiVersion: apps/v1
kind: Deployment
metadata: {name: careslot-broken-image, namespace: careslot}
spec:
  replicas: 1
  selector: {matchLabels: {app: broken-image}}
  template:
    metadata: {labels: {app: broken-image}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: backend
          image: ghcr.io/madarauchiha-tech/careslot-backend:does-not-exist
