# Guard rails so a runaway HPA or bad deploy cannot starve the rest of the cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: careslot-quota
  namespace: careslot
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: careslot-defaults
  namespace: careslot
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {cpu: 250m, memory: 256Mi}
