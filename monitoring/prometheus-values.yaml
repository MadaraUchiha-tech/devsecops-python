# helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f monitoring/prometheus-values.yaml
prometheus:
  prometheusSpec:
    # Scrape ServiceMonitors from every namespace, not only ones labelled for this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    retention: 3d
    scrapeInterval: 15s
    resources:
      requests: {cpu: 200m, memory: 512Mi}

alertmanager:
  enabled: false   # not needed for the capstone demo; keeps minikube light

grafana:
  enabled: true
  adminPassword: careslot-admin   # demo only; use an existing secret in real clusters
  defaultDashboardsTimezone: browser
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [grafana.careslot.local]

nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true
