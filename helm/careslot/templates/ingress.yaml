{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "careslot.fullname" . }}
  labels: {{- include "careslot.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # /api/* goes straight to FastAPI (its routes already carry the /api prefix).
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "careslot.fullname" . }}-backend
                port: {name: http}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "careslot.fullname" . }}-frontend
                port: {name: http}
{{- end }}
