{{- $name := printf "%s-backend" (include "careslot.fullname" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "careslot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "careslot.selector" (dict "ctx" . "component" "backend") | nindent 6 }}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {{- include "careslot.selector" (dict "ctx" . "component" "backend") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "careslot.podSecurity" . | nindent 6 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- include "careslot.containerSecurity" . | nindent 10 }}
          ports:
            - {name: http, containerPort: 8000}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ include "careslot.fullname" . }}-db, key: DATABASE_URL}}
            - name: SEED_DEMO_DATA
              value: {{ .Values.backend.seedDemoData | quote }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "careslot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector: {{- include "careslot.selector" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    - {name: http, port: 8000, targetPort: http}
