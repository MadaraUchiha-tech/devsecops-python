{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Picked up automatically by the kube-prometheus-stack Grafana sidecar (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "careslot.fullname" . }}-dashboard
  labels:
    {{- include "careslot.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  careslot.json: |-
{{ .Files.Get "dashboards/careslot.json" | indent 4 }}
{{- end }}
