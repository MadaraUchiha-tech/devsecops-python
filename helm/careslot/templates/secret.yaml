apiVersion: v1
kind: Secret
metadata:
  name: {{ include "careslot.fullname" . }}-db
  labels: {{- include "careslot.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: "postgresql+psycopg://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ include "careslot.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
