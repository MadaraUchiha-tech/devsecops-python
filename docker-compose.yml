# One-command local stack: docker compose up --build  ->  http://localhost:3000
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careslot
      POSTGRES_USER: careslot
      POSTGRES_PASSWORD: careslot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careslot -d careslot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: careslot-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://careslot:careslot@postgres:5432/careslot
      SEED_DEMO_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    image: careslot-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  postgres-data:
